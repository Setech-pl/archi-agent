name: Clean-clone CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.platform }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            os: Linux
          - runner: macos-15
            platform: darwin
            arch: arm64
            os: macOS
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Verify environment and record tested revision
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_OS: ${{ matrix.os }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --version
          npm --version
          uname -a
          git rev-parse HEAD
          echo "PR head SHA: ${PR_HEAD_SHA:-not a PR}"
          test "$RUNNER_OS" = "$EXPECTED_OS"
          node -e 'console.log(process.platform, process.arch); if (process.version !== "v22.12.0" || process.platform !== process.env.EXPECTED_PLATFORM || process.arch !== process.env.EXPECTED_ARCH || process.getuid() === 0) process.exit(1)'
          command -v zip
          command -v tar
          command -v patch
      - run: npm ci
      - run: npm ci --prefix experiments/ux2-ocr
      - run: node scripts/prepare-ci-ocr.mjs
      - run: npm run typecheck
      - run: npm run extension:typecheck
      # Packaging tests mutate dist/ and the OCR stage; keep both suites and steps sequential.
      - run: npm test -- --no-file-parallelism
      - run: npm run extension:test -- --no-file-parallelism
      - name: Package and verify Core, Full and CLI/MCP
        run: |
          npm run extension:package -- --profile core --out build/ci/core
          npm run extension:verify -- build/ci/core/archi-agent-core-0.3.0-alpha.8.vsix
          npm run extension:package -- --profile full --out build/ci/full
          npm run extension:verify -- build/ci/full/archi-agent-full-0.3.0-alpha.8.vsix
          npm run cli:package -- build/ci/cli
          npm run cli:verify -- build/ci/cli/archi-agent-cli-0.3.0-alpha.8.tgz
      - name: Check bilingual offline documentation
        run: |
          mkdir -p build/ci/docs-core build/ci/docs-full
          # Self-baselines check documentation, not historical C5 byte parity.
          node scripts/docs/check-docs.mjs build/ci/docs-core build/ci/core/archi-agent-core-0.3.0-alpha.8.vsix --docs build/ci/core/archi-agent-core-0.3.0-alpha.8.vsix
          node scripts/docs/check-docs.mjs build/ci/docs-full build/ci/full/archi-agent-full-0.3.0-alpha.8.vsix --docs build/ci/full/archi-agent-full-0.3.0-alpha.8.vsix
      - name: Build and verify standalone DEMO1 archives
        run: |
          python3 scripts/check-demo-docs.py
          python3 scripts/build-demo-archives.py --out build/ci/demos
          node scripts/demo1-verify.mjs build/ci/core/archi-agent-core-0.3.0-alpha.8.vsix build/ci/full/archi-agent-full-0.3.0-alpha.8.vsix build/ci/cli/archi-agent-cli-0.3.0-alpha.8.tgz build/ci/demos build/ci/demo-verification
      - name: Real Extension Host on macOS ARM64
        if: matrix.platform == 'darwin'
        run: |
          curl --fail --location --retry 2 https://update.code.visualstudio.com/latest/darwin-arm64/stable -o "$RUNNER_TEMP/vscode.zip"
          unzip -q "$RUNNER_TEMP/vscode.zip" -d "$RUNNER_TEMP/ea34-vscode"
          export ARCHI_VSCODE_BINARY="$RUNNER_TEMP/ea34-vscode/Visual Studio Code.app/Contents/MacOS/Electron"
          if [ ! -x "$ARCHI_VSCODE_BINARY" ]; then
            export ARCHI_VSCODE_BINARY="$RUNNER_TEMP/ea34-vscode/Visual Studio Code.app/Contents/MacOS/Code"
          fi
          export PATH="$RUNNER_TEMP/ea34-vscode/Visual Studio Code.app/Contents/Resources/app/bin:$PATH"
          node scripts/ea3-ea4-host-smoke.mjs build/ci/core/archi-agent-core-0.3.0-alpha.8.vsix build/ci/full/archi-agent-full-0.3.0-alpha.8.vsix build/ci/extension-host
      - name: Preserve real Extension Host diagnostics
        if: always() && matrix.platform == 'darwin'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ea34-extension-host-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: build/ci/extension-host/
      - name: Record package checksums and source revision
        run: |
          node --input-type=module -e 'import{readFileSync,writeFileSync}from"node:fs";import{createHash}from"node:crypto";import{execFileSync}from"node:child_process";const files=["core/archi-agent-core-0.3.0-alpha.8.vsix","full/archi-agent-full-0.3.0-alpha.8.vsix","cli/archi-agent-cli-0.3.0-alpha.8.tgz"];const artifacts=files.map(file=>{const b=readFileSync("build/ci/"+file);return{file,bytes:b.length,sha256:createHash("sha256").update(b).digest("hex")}});writeFileSync("build/ci/packages.json",JSON.stringify({testedSha:execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),platform:process.platform,arch:process.arch,artifacts},null,2)+"\n");writeFileSync("build/ci/SHA256SUMS",artifacts.map(a=>a.sha256+"  "+a.file).join("\n")+"\n")'
      - name: Upload verified PR candidate packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archi-agent-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
          path: |
            build/ci/core/*.vsix
            build/ci/full/*.vsix
            build/ci/cli/*.tgz
            build/ci/packages.json
            build/ci/SHA256SUMS
            build/ci/docs-*/documentation-check.json
            build/ci/demos/*.zip
            build/ci/demos/demos.json
            build/ci/demo-verification/report.json
            build/ci/extension-host/**/*.json
            build/ci/extension-host/**/*.log
      - name: Verify lockfiles and tracked files remain unchanged
        if: always()
        run: |
          git diff --exit-code HEAD -- package-lock.json experiments/ux2-ocr/package-lock.json
          git diff --exit-code HEAD
          git diff --check
